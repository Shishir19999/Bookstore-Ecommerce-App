<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Folio Books: discover, preview and buy books across every genre. Bestsellers, new arrivals, author pages and a personal reading list." />
    <meta name="theme-color" content="#faf6f0" />
    <meta property="og:title" content="Folio Books" />
    <meta property="og:description" content="Books for every reader: browse by genre, read a preview, keep a reading list." />
    <meta property="og:type" content="website" />
    <title>Folio Books - books for every reader</title>
    <script>
      try {
        var t = localStorage.getItem('bookstore_theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Folio Books needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
